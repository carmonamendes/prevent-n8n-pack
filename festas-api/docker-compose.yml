services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-troque_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-festas}
      MARIADB_USER: ${MARIADB_USER:-festas}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-festas_pwd}
    volumes:
      - festas_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Exponha só se precisar acessar o banco de fora da rede docker:
    # ports:
    #   - "3306:3306"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro da rede docker o host do banco é "db"
      DATABASE_URL: "mysql://${MARIADB_USER:-festas}:${MARIADB_PASSWORD:-festas_pwd}@db:3306/${MARIADB_DATABASE:-festas}"
    ports:
      - "${PORT:-3333}:3333"

volumes:
  festas_db:
